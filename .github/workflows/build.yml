name: Build PowerItems

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Plugin bauen
        run: mvn -B package

      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PowerItems-Plugin
          path: target/PowerItems.jar
