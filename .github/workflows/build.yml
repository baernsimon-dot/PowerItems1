name: Build PowerItems

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Ordnerstruktur herstellen
        run: |
          mkdir -p src/main/java/de/poweritems src/main/resources
          if [ -f PowerItems.java ]; then mv PowerItems.java src/main/java/de/poweritems/; fi
          if [ -f plugin.yml ]; then mv plugin.yml src/main/resources/; fi
          find . -path ./.git -prune -o -type f -print

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Plugin bauen
        run: mvn -B package

      - name: Pruefen ob die Jar vollstaendig ist
        run: |
          unzip -l target/PowerItems.jar
          unzip -l target/PowerItems.jar | grep -q "plugin.yml"
          unzip -l target/PowerItems.jar | grep -q "de/poweritems/PowerItems.class"

      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PowerItems-Plugin
          path: target/PowerItems.jar
